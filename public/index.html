<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante CTRL</title>
<style>
  :root {
    --bg: #dfded9;
    --fg: #000000;
    --accent: #ff4000;
    --accent-blue: #0000ff;
    --border: 3px solid #000;
    --shadow: 6px 6px 0px #000;
    --shadow-sm: 3px 3px 0px #000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 2rem;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: var(--border);
    padding-bottom: 1rem;
  }

  .header h1 {
    font-size: 2.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -1px;
  }

  .badge {
    padding: 0.5rem 1rem;
    border: var(--border);
    background: #fff;
    font-weight: bold;
    box-shadow: var(--shadow-sm);
  }

  .badge.active { background: #bdf62d; }
  .badge.stopped { background: var(--accent); color: #fff; }

  .main-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 2rem;
    flex-grow: 1;
    min-height: 0;
  }

  .visual-container {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 1.5rem;
    overflow: hidden;
  }

  .visual-box {
    border: var(--border);
    background: #fff;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .visual-header {
    background: var(--fg);
    color: #fff;
    padding: 0.5rem 1rem;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.8rem;
    display: flex;
    justify-content: space-between;
  }

  .visual-content {
    padding: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    overflow-y: auto;
    align-content: flex-start;
  }

  .entity {
    width: 100px;
    height: 100px;
    border: 2px solid var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 0.7rem;
    font-weight: bold;
    background: #eee;
    transition: all 0.2s;
    box-shadow: 2px 2px 0px #000;
  }

  .entity.active { background: #bdf62d; }
  .entity.waiting { background: #ffeb3b; }
  .entity.busy { background: var(--accent); color: white; }
  .entity.using { background: var(--accent-blue); color: white; }

  .entity-icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .entity-id { text-transform: uppercase; margin-bottom: 2px; }
  .entity-status { font-size: 0.6rem; opacity: 0.8; }

  .panel {
    background: #fff;
    border: var(--border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    background: var(--fg);
    color: #fff;
    padding: 0.75rem 1rem;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.9rem;
  }

  .panel-content {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .input-group label { font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
  .input-group input { border: 2px solid var(--fg); padding: 0.5rem; font-size: 1rem; font-weight: bold; outline: none; }
  .input-group input:focus { background: #f0f0f0; }

  .btn-row { display: flex; gap: 1rem; margin-top: 1rem; }

  button {
    flex: 1; padding: 0.75rem; border: 2px solid var(--fg); background: #fff;
    font-weight: bold; text-transform: uppercase; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px var(--fg); }
  button.btn-start { background: #bdf62d; }
  button.btn-stop { background: var(--accent); color: white; }
  
  .log-viewer {
    height: 150px;
    background: #f8f8f8;
    border-top: var(--border);
    padding: 1rem;
    overflow-y: auto;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.75rem;
    line-height: 1.2;
  }

  .log-line { padding: 0.15rem 0; border-bottom: 1px solid #ddd; display: flex; gap: 0.5rem; }
  .log-ts { font-weight: bold; color: #666; width: 60px; flex-shrink: 0;}
  .log-type { font-weight: bold; width: 70px; flex-shrink: 0; font-size: 0.7rem; }
  .log-msg { color: #111; }

  .type-DEADLOCK { background: var(--accent); color: white; padding: 0 2px; }
  .type-RECURSO { background: var(--accent-blue); color: white; padding: 0 2px; }
  .type-PEDIDO { color: #0000ff; }
  .type-COCINA { color: #ff00ff; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 1rem; border-bottom: var(--border);
  }
  .stat-box { border: 2px solid var(--fg); padding: 0.5rem; text-align: center; }
  .stat-box .lbl { font-size: 0.6rem; font-weight: bold; text-transform: uppercase; margin-bottom: 0.25rem; }
  .stat-box .val { font-size: 1.4rem; font-weight: 900; }
  .stat-box.alert { background: var(--accent); color: white; }
</style>
</head>
<body>

  <header class="header">
    <h1>Restaurante_CTRL</h1>
    <div id="status-badge" class="badge stopped">OFFLINE</div>
  </header>

  <div class="main-layout">
    
    <aside class="panel">
      <div class="panel-header">Parámetros del Sistema</div>
      <div class="panel-content" style="padding: 1rem; gap: 0.75rem;">
        <form id="config-form">
          <div class="input-group">
            <label>Nº Clientes</label>
            <input type="number" id="inp-clientes" value="10" min="1" max="20">
          </div>
          <div class="input-group">
            <label>Nº Cocineros</label>
            <input type="number" id="inp-cocineros" value="2" min="1">
          </div>
          <div class="input-group">
            <label>Nº Meseros</label>
            <input type="number" id="inp-meseros" value="2" min="1">
          </div>
          <div class="input-group">
            <label>Nº Mesas</label>
            <input type="number" id="inp-mesas" value="5" min="1" max="10">
          </div>
          <div class="input-group">
            <label>Nº Hornos</label>
            <input type="number" id="inp-hornos" value="1" min="1">
          </div>
          <div class="input-group">
            <label>Nº Sartenes</label>
            <input type="number" id="inp-sartenes" value="1" min="1">
          </div>
          
          <div class="btn-row">
            <button type="button" class="btn-start" onclick="startSim()">Iniciar</button>
            <button type="button" class="btn-stop" onclick="stopSim()">Parar</button>
          </div>
        </form>
      </div>
    </aside>

    <main class="panel" style="overflow: hidden;">
      <div class="panel-header">Monitor en Tiempo Real</div>
      
      <div class="stats-grid">
        <div class="stat-box">
          <div class="lbl">Atendidos</div>
          <div class="val" id="stat-atendidos">0</div>
        </div>
        <div class="stat-box">
          <div class="lbl">Espera Prom.</div>
          <div class="val" id="stat-espera">0s</div>
        </div>
        <div class="stat-box" id="box-deadlocks">
          <div class="lbl">Deadlocks</div>
          <div class="val" id="stat-deadlocks">0</div>
        </div>
      </div>

      <div class="visual-container">
        <div class="visual-box">
          <div class="visual-header">
            <span>COCINA (Cocineros, Hornos, Sartenes)</span>
            <span id="kitchen-status">STANDBY</span>
          </div>
          <div class="visual-content" id="kitchen-content">
            <!-- Dinámico -->
          </div>
        </div>
        <div class="visual-box">
          <div class="visual-header">
            <span>SALA (Mesas, Meseros)</span>
            <span id="room-status">CERRADO</span>
          </div>
          <div class="visual-content" id="room-content">
            <!-- Dinámico -->
          </div>
        </div>
      </div>

      <div class="log-viewer" id="log-viewer">
        <div style="color: #666; font-style: italic;">Esperando inicio...</div>
      </div>
    </main>

  </div>
<script>
  let isRunning = false;
  let hasStarted = false;
  let lastLogLength = 0;
  let logQueue = [];
  let stats = { atendidos: 0, deadlocks: 0, totalEspera: 0 };
  
  // Estado de las entidades
  let state = {
    cocineros: {},
    meseros: {},
    mesas: {},
    hornos: {},
    sartenes: {}
  };

  function initEntities() {
    const nCocineros = parseInt(document.getElementById('inp-cocineros').value);
    const nMeseros = parseInt(document.getElementById('inp-meseros').value);
    const nMesas = parseInt(document.getElementById('inp-mesas').value);
    const nHornos = parseInt(document.getElementById('inp-hornos').value);
    const nSartenes = parseInt(document.getElementById('inp-sartenes').value);

    state = { cocineros: {}, meseros: {}, mesas: {}, hornos: {}, sartenes: {} };
    
    const kitchen = document.getElementById('kitchen-content');
    const room = document.getElementById('room-content');
    kitchen.innerHTML = '';
    room.innerHTML = '';

    // Crear Cocineros
    for (let i = 1; i <= nCocineros; i++) {
      state.cocineros[i] = { status: 'LIBRE', client: null };
      createEntity('kitchen-content', `coc-${i}`, '👨‍🍳', `Coc. ${i}`, 'LIBRE');
    }
    // Crear Hornos
    for (let i = 1; i <= nHornos; i++) {
      state.hornos[i] = { status: 'LIBRE' };
      createEntity('kitchen-content', `hor-${i}`, '🔥', `Horno ${i}`, 'LIBRE');
    }
    // Crear Sartenes
    for (let i = 1; i <= nSartenes; i++) {
      state.sartenes[i] = { status: 'LIBRE' };
      createEntity('kitchen-content', `sar-${i}`, '🍳', `Sartén ${i}`, 'LIBRE');
    }

    // Crear Mesas
    for (let i = 1; i <= nMesas; i++) {
      state.mesas[i] = { status: 'LIBRE', client: null };
      createEntity('room-content', `mesa-${i}`, '🪑', `Mesa ${i}`, 'LIBRE');
    }
    // Crear Meseros
    for (let i = 1; i <= nMeseros; i++) {
      state.meseros[i] = { status: 'LIBRE', client: null };
      createEntity('room-content', `mes-${i}`, '🤵', `Mesero ${i}`, 'LIBRE');
    }

    document.getElementById('kitchen-status').textContent = 'OPERANDO';
    document.getElementById('room-status').textContent = 'ABIERTO';
  }

  function createEntity(containerId, id, icon, label, status) {
    const cont = document.getElementById(containerId);
    const div = document.createElement('div');
    div.id = id;
    div.className = 'entity';
    div.innerHTML = `
      <div class="entity-icon">${icon}</div>
      <div class="entity-id">${label}</div>
      <div class="entity-status">${status}</div>
    `;
    cont.appendChild(div);
  }

  function updateEntityUI(type, id, status, subtext = '') {
    let elementId = '';
    if (type === 'cocinero') elementId = `coc-${id}`;
    else if (type === 'mesero') elementId = `mes-${id}`;
    else if (type === 'mesa') elementId = `mesa-${id}`;
    else if (type === 'horno') elementId = `hor-${id}`;
    else if (type === 'sarten') elementId = `sar-${id}`;

    const el = document.getElementById(elementId);
    if (!el) return;

    el.className = 'entity';
    if (status === 'PREPARANDO' || status === 'SIRVIENDO' || status === 'OCUPADA') el.classList.add('busy');
    else if (status === 'ESPERANDO' || status === 'LISTO') el.classList.add('waiting');
    else if (status === 'USANDO') el.classList.add('using');
    else if (status === 'LIBRE') el.classList.add('active');

    el.querySelector('.entity-status').textContent = subtext || status;
  }

  async function startSim() {
    const data = {
      clientes: document.getElementById('inp-clientes').value,
      cocineros: document.getElementById('inp-cocineros').value,
      meseros: document.getElementById('inp-meseros').value,
      mesas: document.getElementById('inp-mesas').value,
      hornos: document.getElementById('inp-hornos').value,
      sartenes: document.getElementById('inp-sartenes').value
    };

    try {
      const res = await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        isRunning = true;
        hasStarted = true;
        updateBadge();
        initEntities();
        document.getElementById('log-viewer').innerHTML = '';
        lastLogLength = 0;
        logQueue = [];
        stats = { atendidos: 0, deadlocks: 0, totalEspera: 0 };
        document.getElementById('box-deadlocks').classList.remove('alert');
        updateStatsUI();
      } else {
        const err = await res.json();
        alert(err.error);
      }
    } catch (e) {
      alert("Error conectando con el servidor local.");
    }
  }

  async function stopSim() {
    try {
      const res = await fetch('/api/stop', { method: 'POST' });
      if (res.ok) {
        isRunning = false;
        updateBadge();
        document.getElementById('kitchen-status').textContent = 'STANDBY';
        document.getElementById('room-status').textContent = 'CERRADO';
      }
    } catch (e) { }
  }

  function updateBadge() {
    const b = document.getElementById('status-badge');
    if (isRunning) {
      b.textContent = 'RUNNING'; b.className = 'badge active';
    } else {
      b.textContent = 'OFFLINE'; b.className = 'badge stopped';
    }
  }

  async function pollLogs() {
    if (!hasStarted) return;
    try {
      const res = await fetch('/api/logs');
      const text = await res.text();
      const lines = text.trim().split('\n').filter(Boolean);
      if (lines.length > lastLogLength) {
        const newLines = lines.slice(lastLogLength);
        lastLogLength = lines.length;
        newLines.forEach(line => {
          const parts = line.split('|');
          if (parts.length >= 3) {
            logQueue.push({ ts: parts[0], type: parts[1], msg: parts[2] });
          }
        });
      }
    } catch (e) {}
  }

  function processQueue() {
    if (logQueue.length === 0) return;
    const entry = logQueue.shift();
    const { ts, type, msg } = entry;
    const viewer = document.getElementById('log-viewer');
    const isScrolledToBottom = viewer.scrollHeight - viewer.clientHeight <= viewer.scrollTop + 50;

    // --- Lógica de Estado Visual ---
    
    // Mesas
    if (type === 'MESA') {
      const mSit = msg.match(/\[Cliente (\d+)\] Se sentó/);
      const mFree = msg.match(/\[Cliente (\d+)\] Terminó y liberó/);
      if (mSit) {
        const cid = mSit[1];
        const mesaId = Object.keys(state.mesas).find(k => state.mesas[k].status === 'LIBRE');
        if (mesaId) {
          state.mesas[mesaId] = { status: 'OCUPADA', client: cid };
          updateEntityUI('mesa', mesaId, 'OCUPADA', `Cli. ${cid}`);
        }
      } else if (mFree) {
        const cid = mFree[1];
        const mesaId = Object.keys(state.mesas).find(k => state.mesas[k].client === cid);
        if (mesaId) {
          state.mesas[mesaId] = { status: 'LIBRE', client: null };
          updateEntityUI('mesa', mesaId, 'LIBRE');
        }
      }
    }

    // Cocina
    if (type === 'COCINA') {
      const mPrep = msg.match(/\[Cocinero (\d+)\] Preparando orden.*Cliente (\d+)/);
      const mDone = msg.match(/\[Cocinero (\d+)\] Orden del Cliente (\d+) lista/);
      if (mPrep) {
        const coid = mPrep[1];
        const cid = mPrep[2];
        state.cocineros[coid] = { status: 'PREPARANDO', client: cid };
        updateEntityUI('cocinero', coid, 'PREPARANDO', `Cli. ${cid}`);
      } else if (mDone) {
        const coid = mDone[1];
        state.cocineros[coid] = { status: 'LIBRE', client: null };
        updateEntityUI('cocinero', coid, 'LISTO');
        setTimeout(() => { if(state.cocineros[coid].status === 'LIBRE') updateEntityUI('cocinero', coid, 'LIBRE'); }, 2000);
      }
    }

    // Recursos
    if (type === 'RECURSO') {
      const mTookH = msg.match(/\[Cocinero (\d+)\] Tomó el HORNO/);
      const mTookS = msg.match(/\[Cocinero (\d+)\] Tomó la SARTÉN/);
      const mFree = msg.match(/\[Cocinero (\d+)\] Liberó HORNO y SARTÉN/);
      
      if (mTookH) {
        const hId = Object.keys(state.hornos).find(k => state.hornos[k].status === 'LIBRE');
        if (hId) {
          state.hornos[hId].status = 'OCUPADO';
          state.hornos[hId].by = mTookH[1];
          updateEntityUI('horno', hId, 'USANDO', `Coc. ${mTookH[1]}`);
        }
      }
      if (mTookS) {
        const sId = Object.keys(state.sartenes).find(k => state.sartenes[k].status === 'LIBRE');
        if (sId) {
          state.sartenes[sId].status = 'OCUPADO';
          state.sartenes[sId].by = mTookS[1];
          updateEntityUI('sarten', sId, 'USANDO', `Coc. ${mTookS[1]}`);
        }
      }
      if (mFree) {
        const coid = mFree[1];
        Object.keys(state.hornos).forEach(k => { if(state.hornos[k].by === coid) { state.hornos[k].status = 'LIBRE'; state.hornos[k].by = null; updateEntityUI('horno', k, 'LIBRE'); }});
        Object.keys(state.sartenes).forEach(k => { if(state.sartenes[k].by === coid) { state.sartenes[k].status = 'LIBRE'; state.sartenes[k].by = null; updateEntityUI('sarten', k, 'LIBRE'); }});
      }
    }

    // Meseros
    if (type === 'MESERO') {
      const mLev = msg.match(/\[Mesero (\d+)\] Llevando comida.*Cliente (\d+)/);
      const mEnt = msg.match(/\[Mesero (\d+)\] Entregó comida.*Cliente (\d+)/);
      if (mLev) {
        const mid = mLev[1];
        const cid = mLev[2];
        state.meseros[mid] = { status: 'SIRVIENDO', client: cid };
        updateEntityUI('mesero', mid, 'SIRVIENDO', `Cli. ${cid}`);
      } else if (mEnt) {
        const mid = mEnt[1];
        state.meseros[mid] = { status: 'LIBRE', client: null };
        updateEntityUI('mesero', mid, 'LIBRE');
      }
    }

    if (type === 'COMIENDO') {
      stats.atendidos++;
      const e = msg.match(/Espera total: (\d+)s/);
      if (e) stats.totalEspera += parseInt(e[1]);
    }
    
    if (type === 'DEADLOCK' && msg.includes('DETECTADO')) {
      stats.deadlocks++;
      document.getElementById('box-deadlocks').classList.add('alert');
    }
    
    if (type === 'SISTEMA' && msg.includes('Restaurante Cerrado')) {
      isRunning = false;
      updateBadge();
      document.getElementById('kitchen-status').textContent = 'CERRADO';
      document.getElementById('room-status').textContent = 'CERRADO';
    }

    const div = document.createElement('div');
    div.className = 'log-line';
    div.innerHTML = `<span class="log-ts">${ts}</span><span class="log-type type-${type}">${type}</span><span class="log-msg">${msg.replace(/</g, '&lt;')}</span>`;
    viewer.appendChild(div);

    updateStatsUI();
    if (isScrolledToBottom) viewer.scrollTop = viewer.scrollHeight;
  }

  function updateStatsUI() {
    document.getElementById('stat-atendidos').textContent = stats.atendidos;
    document.getElementById('stat-espera').textContent = stats.atendidos > 0 ? Math.round(stats.totalEspera / stats.atendidos) + 's' : '0s';
    document.getElementById('stat-deadlocks').textContent = stats.deadlocks;
  }

  setInterval(pollLogs, 1000);
  setInterval(processQueue, 100);
</script>
</body>
</html>
